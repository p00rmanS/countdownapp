# Builds every platform on each push so problems show up without needing a Mac or a phone.
name: build
on: [push, pull_request, workflow_dispatch]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm test

  android:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci && npm run build && npx cap sync android
      - run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: android-debug-apk, path: android/app/build/outputs/apk/debug/app-debug.apk }

  # iOS: compiles for the simulator, needs no Apple account. Download the artifact and drag the .app
  # onto a running Simulator, or open the project in Xcode on a Mac.
  ios:
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci && npm run build && npx cap sync ios
      - run: |
          cd ios/App
          pod install
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - run: cd ios/App/build/Build/Products/Debug-iphonesimulator && zip -r Pawcount-simulator.zip App.app
      - uses: actions/upload-artifact@v4
        with: { name: ios-simulator-app, path: ios/App/build/Build/Products/Debug-iphonesimulator/Pawcount-simulator.zip }
