# Builds and tests every platform on each push, so problems show up without needing a Mac or a phone.
name: build
on: [push, pull_request, workflow_dispatch]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm test
      # the shared art must be in sync with the web source
      - run: node tools/export-native.js && git diff --exit-code native/assets

  android:
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Unit tests + debug build
        working-directory: apps/android
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: android-debug-apk, path: apps/android/app/build/outputs/apk/debug/app-debug.apk }

  # iOS: builds the native SwiftUI app, runs the Swift unit tests in the simulator, then launches the app on
  # several screens and uploads screenshots. Needs no Apple account.
  ios:
    runs-on: macos-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - name: Generate the Xcode project
        working-directory: apps/ios
        run: brew install xcodegen && xcodegen generate
      - name: Pick a simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k in sorted(d, reverse=True) if 'iOS' in k for x in d[k] if 'iPhone' in x['name'] and x['isAvailable']))")
          echo "UDID=$UDID" >> $GITHUB_ENV
      - name: Unit tests
        working-directory: apps/ios
        run: |
          xcodebuild test -project Pawcount.xcodeproj -scheme Pawcount -destination "id=$UDID" -derivedDataPath build CODE_SIGNING_ALLOWED=NO > test.log 2>&1 || { grep -E "error:" test.log | sort -u | head -100; tail -15 test.log; exit 1; }
          grep -E "Executed [0-9]+ tests" test.log | tail -2
      - name: Screenshots
        working-directory: apps/ios
        run: |
          xcrun simctl boot $UDID || true
          APP=$(find build/Build/Products -name "Pawcount.app" -maxdepth 3 | head -1)
          xcrun simctl install $UDID "$APP"
          mkdir -p shots
          for s in welcome home detail detail-nap detail-zoom detail-memory flow settings memories; do
            xcrun simctl launch $UDID app.pawcount.countdown -demo $s
            sleep 6
            xcrun simctl io $UDID screenshot shots/$s.png
            xcrun simctl terminate $UDID app.pawcount.countdown
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: ios-screenshots, path: apps/ios/shots }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: ios-test-log, path: apps/ios/test.log }
